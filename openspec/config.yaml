schema: spec-driven

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
context: |
  Project: quarta-landing — lead-generation landing page: a request form (subscription or
  one-time order) that a manager follows up on by phone. No cart, no online payments.
  Write all OpenSpec artifacts and documentation in English.
  Stack constraints for proposals and specs: Next.js (App Router) + TypeScript (strict, `any`
  forbidden) + Tailwind CSS + shadcn/ui; Server Components by default; forms via zod +
  react-hook-form with shared schemas and Server Actions; deploy on Vercel.
  Detailed rules live in .clinerules/project.md.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
